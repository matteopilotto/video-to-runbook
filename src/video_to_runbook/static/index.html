<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Video to Runbook</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Tokens from DESIGN.md (Vercel Geist). --success is the one addition: verified stays green. */
  :root {
    --ink: #171717; --body: #4d4d4d; --mute: #8f8f8f; --faint: #a1a1a1;
    --hairline: #ebebeb; --hairline-soft: #f2f2f2; --canvas: #fafafa; --elevated: #ffffff;
    --link: #0070f3; --link-deep: #0761d1; --link-soft: #d3e5ff;
    --error: #ee0000; --error-deep: #c50000;
    --warning: #f5a623; --warning-soft: #ffefcf; --warning-deep: #ab570a;
    --success: #1f8f4e; --success-soft: #e6f4ea;
    --r-sm: 6px; --r-md: 12px;
    --sans: Geist, Inter, -apple-system, system-ui, Arial, sans-serif;
    --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 400 14px/20px var(--sans); color: var(--body); background: var(--canvas); }
  header { padding: 12px 24px; border-bottom: 1px solid var(--hairline); background: var(--canvas); }
  header h1 { margin: 0; font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: -0.28px; color: var(--ink); }
  main { display: grid; grid-template-columns: minmax(320px, 2fr) 3fr; gap: 24px; padding: 24px; min-height: calc(100vh - 90px); }
  @media (max-width: 768px) { main { grid-template-columns: 1fr; } }
  #left, #right { min-width: 0; }
  #dropzone { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; height: 320px; border: 1px dashed var(--faint); border-radius: var(--r-md); background: var(--elevated); cursor: pointer; text-align: center; padding: 24px; }
  #dropzone.over { border-color: var(--link); background: var(--link-soft); }
  #dropzone strong { color: var(--ink); font-weight: 500; }
  #dropzone .hint { color: var(--mute); font-size: 12px; }
  #dropzone .reason { color: var(--error); }
  #dropzone input { display: none; }
  video { width: 100%; border: 1px solid var(--hairline); border-radius: var(--r-md); background: #000; display: none; }
  #right .state { color: var(--mute); }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--hairline); border-top-color: var(--mute); border-radius: 50%; animation: spin 0.9s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h2 { margin: 0 0 4px; font-size: 32px; line-height: 40px; font-weight: 600; letter-spacing: -1.28px; color: var(--ink); }
  .system { margin: 0 0 24px; color: var(--mute); }
  h3, .steps .row.head { margin: 24px 0 8px; font: 500 12px/16px var(--mono); text-transform: uppercase; letter-spacing: 0.04em; color: var(--mute); }
  .steps { background: var(--elevated); border: 1px solid var(--hairline); border-radius: var(--r-md); overflow: hidden; }
  .steps .row { display: grid; grid-template-columns: 2em 4.5em 5.5em 1.4fr 1fr 1fr 1.6fr 6em; gap: 0 8px; padding: 8px 12px; border-bottom: 1px solid var(--hairline); align-items: start; list-style: none; }
  .steps .row::-webkit-details-marker { display: none; }
  .steps .row.head { margin: 0; }
  .steps > :last-child > .row, .steps > .row:last-child, .steps > :last-child > .note { border-bottom: 0; }
  .steps .row:not(.head) { cursor: pointer; }
  .steps .row:not(.head):hover { background: var(--hairline-soft); }
  .steps .row:not(.head) > :nth-child(4) { color: var(--ink); }
  .steps .time, .steps .action { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .steps .note { margin: 0; padding: 4px 12px 12px calc(2em + 4.5em + 5.5em + 36px); color: var(--error-deep); border-bottom: 1px solid var(--hairline); background: var(--canvas); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: var(--r-sm); font-size: 12px; line-height: 16px; font-weight: 500; white-space: nowrap; }
  .badge.checking { background: var(--hairline-soft); color: var(--mute); }
  .badge.verified { background: var(--success-soft); color: var(--success); }
  .badge.flagged { background: var(--error); color: #fff; }
  .badge.error { background: var(--warning-soft); color: var(--warning-deep); }
  .badge.error::before { content: "\26A0\FE0E "; }
  .banner { padding: 8px 12px; border-radius: var(--r-sm); background: var(--elevated); border: 1px solid var(--error); color: var(--error); margin-bottom: 12px; }
  .actions { margin-left: auto; display: flex; gap: 8px; }
  .actions a { display: none; padding: 4px 10px; border-radius: var(--r-sm); font-size: 14px; line-height: 20px; font-weight: 500; text-decoration: none; }
  .actions a[href] { display: inline-block; }
  #trace { background: var(--elevated); color: var(--ink); border: 1px solid var(--hairline); }
  #export { background: var(--ink); color: #fff; }
  footer { padding: 12px 24px; border-top: 1px solid var(--hairline); background: var(--canvas); color: var(--mute); font-size: 12px; line-height: 16px; display: flex; align-items: center; gap: 24px; min-height: 52px; }
  #elapsed, #calls, #tokens { font-family: var(--mono); }
</style>
</head>
<body>
<header><h1>Video to Runbook</h1></header>
<main>
  <section id="left">
    <label id="dropzone">
      <input type="file" id="file" accept="video/*">
      <strong>Drop a screen recording here</strong>
      <span class="hint">or click to choose a file. Video only, up to 100 MB.</span>
      <span class="reason" id="reason"></span>
    </label>
    <video id="video" controls preload="metadata"></video>
  </section>
  <section id="right">
    <p class="state">Drop a screen recording to begin</p>
  </section>
</main>
<footer>
  <span id="elapsed"></span>
  <span id="calls"></span>
  <span id="tokens"></span>
  <span id="tamper"></span>
  <div class="actions">
    <a id="trace" target="_blank" rel="noopener">View trace</a>
    <a id="export" download>Export Markdown</a>
  </div>
</footer>
<script>
  const MAX_BYTES = 100 * 1024 * 1024;
  const dropzone = document.getElementById("dropzone");
  const fileInput = document.getElementById("file");
  const reason = document.getElementById("reason");
  const video = document.getElementById("video");
  const right = document.getElementById("right");
  const elapsedEl = document.getElementById("elapsed");
  const callsEl = document.getElementById("calls");
  const tokensEl = document.getElementById("tokens");
  const tamperEl = document.getElementById("tamper");
  const traceEl = document.getElementById("trace");
  const exportEl = document.getElementById("export");
  const tamperStep = new URLSearchParams(location.search).get("tamper");

  let runId = null;
  let startedAt = null;
  let pollTimer = null;
  let tickTimer = null;

  function setRight(html) { right.innerHTML = html; }

  function refuse(file) {
    if (!file.type.startsWith("video/")) return "That is not a video file.";
    if (file.size > MAX_BYTES) return "That file is over 100 MB.";
    return null;
  }

  async function upload(file) {
    const why = refuse(file);
    if (why) { reason.textContent = why; return; }
    reason.textContent = "";
    dropzone.querySelector("strong").textContent = "Uploading " + file.name + "…";
    setRight('<p class="state">Uploading…</p>');
    const body = new FormData();
    body.append("file", file, file.name);
    if (tamperStep) body.append("tamper_step", tamperStep);
    const response = await fetch("/runs", { method: "POST", body });
    if (!response.ok) {
      dropzone.querySelector("strong").textContent = "Drop a screen recording here";
      reason.textContent = "Upload failed: " + response.status + " " + (await response.text());
      setRight('<p class="state">Drop a screen recording to begin</p>');
      return;
    }
    runId = (await response.json()).run_id;
    startedAt = Date.now();
    dropzone.style.display = "none";
    video.src = "/runs/" + runId + "/video";
    video.style.display = "block";
    video.pause();
    setRight('<p class="state"><span class="spinner"></span> Watching the recording…</p>');
    tickTimer = setInterval(tick, 1000);
    tick();
    pollTimer = setInterval(poll, 2000);
    poll();
  }

  function showElapsed(seconds) { elapsedEl.textContent = "elapsed " + Math.floor(seconds) + " s"; }

  function tick() { showElapsed((Date.now() - startedAt) / 1000); }

  function finish(status) {
    clearInterval(pollTimer);
    clearInterval(tickTimer);
    showElapsed(status.elapsed_s);
    if (status.tamper_step !== null) {
      tamperEl.textContent = status.tamper_applied
        ? "Demo tamper: step " + status.tamper_step
        : "Demo tamper requested for step " + status.tamper_step + ", runbook has " +
          (status.runbook ? status.runbook.steps.length : 0) + " steps";
    }
  }

  async function poll() {
    const response = await fetch("/status/" + runId);
    if (response.status === 404) {
      clearInterval(pollTimer);
      clearInterval(tickTimer);
      setRight('<p class="state">Run not found</p>');
      return;
    }
    if (!response.ok) return;
    const status = await response.json();
    callsEl.textContent = "calls " + status.calls;
    tokensEl.textContent = "tokens " + (status.input_tokens + status.output_tokens);
    if (status.trace_url && !traceEl.hasAttribute("href")) traceEl.href = status.trace_url;
    if (status.runbook && !exportEl.hasAttribute("href")) exportEl.href = "/runs/" + runId + "/runbook.md";
    const fragment = await fetch("/runs/" + runId + "/runbook.html");
    if (fragment.ok) {
      let html = await fragment.text();
      if (status.state === "failed" && status.runbook) {
        html = '<div class="banner">' + escapeHtml(status.error) + "</div>" + html;
      }
      setRight(html);
    }
    if (status.state === "done" || status.state === "failed") finish(status);
  }

  function escapeHtml(text) {
    const node = document.createElement("span");
    node.textContent = text;
    return node.innerHTML;
  }

  right.addEventListener("click", (event) => {
    const row = event.target.closest("[data-timestamp]");
    if (!row) return;
    video.currentTime = Number(row.dataset.timestamp);
    video.pause();
  });

  fileInput.addEventListener("change", () => { if (fileInput.files[0]) upload(fileInput.files[0]); });
  dropzone.addEventListener("dragover", (event) => { event.preventDefault(); dropzone.classList.add("over"); });
  dropzone.addEventListener("dragleave", () => dropzone.classList.remove("over"));
  dropzone.addEventListener("drop", (event) => {
    event.preventDefault();
    dropzone.classList.remove("over");
    const file = event.dataTransfer.files[0];
    if (file) upload(file);
  });
</script>
</body>
</html>
