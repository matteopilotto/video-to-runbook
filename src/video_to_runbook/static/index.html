<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Video to Runbook</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --grey: #8a8f98; --green: #1f8f4e; --red: #c92a2a; --amber: #d9820b; --line: #e3e5e8; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1c1e21; background: #fafafa; }
  header { padding: 12px 20px; border-bottom: 1px solid var(--line); background: #fff; }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  main { display: grid; grid-template-columns: minmax(320px, 2fr) 3fr; gap: 20px; padding: 20px; min-height: calc(100vh - 110px); }
  #left, #right { min-width: 0; }
  #dropzone { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; height: 320px; border: 2px dashed #b7bcc4; border-radius: 10px; background: #fff; cursor: pointer; text-align: center; padding: 20px; }
  #dropzone.over { border-color: var(--green); background: #f2fbf5; }
  #dropzone .hint { color: var(--grey); font-size: 13px; }
  #dropzone .reason { color: var(--red); }
  #dropzone input { display: none; }
  video { width: 100%; border-radius: 10px; background: #000; display: none; }
  #right .state { color: var(--grey); }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--grey); border-radius: 50%; animation: spin 0.9s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h2 { margin: 0 0 4px; font-size: 20px; }
  .system { margin: 0 0 12px; color: var(--grey); }
  h3 { margin: 16px 0 6px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--grey); }
  .steps { background: #fff; font-size: 14px; border-top: 1px solid var(--line); }
  .steps .row { display: grid; grid-template-columns: 2em 4.5em 5.5em 1.4fr 1fr 1fr 1.6fr 6em; gap: 0 8px; padding: 6px 8px; border-bottom: 1px solid var(--line); align-items: start; list-style: none; }
  .steps .row::-webkit-details-marker { display: none; }
  .steps .row.head { font-weight: 600; color: var(--grey); font-size: 12px; text-transform: uppercase; }
  .steps .row:not(.head) { cursor: pointer; }
  .steps .row:not(.head):hover { background: #f4f6f8; }
  .steps .time { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .steps .action { font-family: ui-monospace, monospace; font-size: 13px; }
  .steps .note { margin: 0; padding: 4px 8px 10px 8px; color: var(--red); border-bottom: 1px solid var(--line); background: #fff7f7; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #fff; white-space: nowrap; }
  .badge.checking { background: var(--grey); }
  .badge.verified { background: var(--green); }
  .badge.flagged { background: var(--red); }
  .badge.error { background: var(--amber); }
  .badge.error::before { content: "\26A0\FE0E "; }
  .banner { padding: 10px 12px; border-radius: 8px; background: #fdecec; color: var(--red); margin-bottom: 12px; }
  #export { display: none; margin-left: auto; color: var(--green); font-weight: 600; text-decoration: none; }
  #export[href] { display: inline; }
  #sop { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 20px; border-top: 1px solid var(--line); background: #fff; font-size: 13px; }
  #sop button { padding: 6px 14px; font: inherit; cursor: pointer; border: 1px solid var(--line); border-radius: 4px; background: #fff; }
  #sop button:disabled { cursor: not-allowed; opacity: .45; }
  #live-label { display: flex; align-items: center; gap: 4px; color: var(--grey); }
  #sop-state { color: var(--grey); }
  footer { padding: 10px 20px; border-top: 1px solid var(--line); background: #fff; color: var(--grey); font-size: 13px; display: flex; gap: 20px; min-height: 40px; }
</style>
</head>
<body>
<header><h1>Video to Runbook</h1></header>
<main>
  <section id="left">
    <label id="dropzone">
      <input type="file" id="file" accept="video/*">
      <strong>Drop a screen recording here</strong>
      <span class="hint">or click to choose a file. Video only, up to 100 MB.</span>
      <span class="reason" id="reason"></span>
    </label>
    <video id="video" controls preload="metadata"></video>
  </section>
  <section id="right">
    <p class="state">Drop a screen recording to begin</p>
  </section>
</main>
<section id="sop">
  <button id="plan-btn" disabled>Generate instructions</button>
  <button id="exec-btn" disabled>Run executor</button>
  <label id="live-label"><input type="checkbox" id="live"> live (writes to SAP)</label>
  <span id="sop-state"></span>
  <a id="plan-link" href="#" target="_blank" rel="noopener" hidden>plan.json</a>
  <a id="trace-link" href="#" target="_blank" rel="noopener" hidden>trace.json</a>
</section>
<footer>
  <span id="elapsed"></span>
  <span id="calls"></span>
  <span id="tokens"></span>
  <span id="tamper"></span>
  <span id="trace"></span>
  <a id="export" download>Export Markdown</a>
</footer>
<script>
  const MAX_BYTES = 100 * 1024 * 1024;
  const dropzone = document.getElementById("dropzone");
  const planBtn = document.getElementById("plan-btn");
  const execBtn = document.getElementById("exec-btn");
  const liveBox = document.getElementById("live");
  const sopState = document.getElementById("sop-state");
  const planLink = document.getElementById("plan-link");
  const traceLink = document.getElementById("trace-link");
  const fileInput = document.getElementById("file");
  const reason = document.getElementById("reason");
  const video = document.getElementById("video");
  const right = document.getElementById("right");
  const elapsedEl = document.getElementById("elapsed");
  const callsEl = document.getElementById("calls");
  const tokensEl = document.getElementById("tokens");
  const tamperEl = document.getElementById("tamper");
  const traceEl = document.getElementById("trace");
  const exportEl = document.getElementById("export");
  const tamperStep = new URLSearchParams(location.search).get("tamper");

  let runId = null;
  let startedAt = null;
  let pollTimer = null;
  let tickTimer = null;

  function setRight(html) { right.innerHTML = html; }

  function refuse(file) {
    if (!file.type.startsWith("video/")) return "That is not a video file.";
    if (file.size > MAX_BYTES) return "That file is over 100 MB.";
    return null;
  }

  async function upload(file) {
    const why = refuse(file);
    if (why) { reason.textContent = why; return; }
    reason.textContent = "";
    dropzone.querySelector("strong").textContent = "Uploading " + file.name + "…";
    setRight('<p class="state">Uploading…</p>');
    const body = new FormData();
    body.append("file", file, file.name);
    if (tamperStep) body.append("tamper_step", tamperStep);
    const response = await fetch("/runs", { method: "POST", body });
    if (!response.ok) {
      dropzone.querySelector("strong").textContent = "Drop a screen recording here";
      reason.textContent = "Upload failed: " + response.status + " " + (await response.text());
      setRight('<p class="state">Drop a screen recording to begin</p>');
      return;
    }
    runId = (await response.json()).run_id;
    startedAt = Date.now();
    dropzone.style.display = "none";
    video.src = "/runs/" + runId + "/video";
    video.style.display = "block";
    video.pause();
    setRight('<p class="state"><span class="spinner"></span> Watching the recording…</p>');
    tickTimer = setInterval(tick, 1000);
    tick();
    pollTimer = setInterval(poll, 2000);
    poll();
  }

  const PLAN_LABEL = {
    none: "", compiling: "Compiling the SOP into a plan…",
    planned: "Plan ready", failed: "Compile failed",
  };
  const EXEC_LABEL = {
    none: "", requested: "Queued — start sop_worker.py on the machine that reaches SAP",
    running: "Executing on the operator machine…", done: "Executed", failed: "Execution failed",
  };

  function renderSop(status) {
    planBtn.disabled = status.state !== "done" || status.plan_state === "compiling";
    execBtn.disabled = status.plan_state !== "planned" ||
                       ["requested", "running"].includes(status.exec_state);
    // A plan the validator rejected is readable but must never touch a live ERP.
    liveBox.disabled = !status.plan_validated;
    liveBox.title = status.plan_validated ? "" : "the plan has validation errors";

    let text = "";
    if (status.exec_state !== "none") {
      text = EXEC_LABEL[status.exec_state];
      if (status.exec_state === "done" || status.exec_state === "failed") {
        text += ` — ${status.exec_steps} step(s), ${status.exec_failed} failed` +
                (status.exec_live ? ", LIVE" : ", dry run");
      }
      if (status.exec_error) text += ` — ${status.exec_error}`;
    } else if (status.plan_state !== "none") {
      text = PLAN_LABEL[status.plan_state];
      if (status.plan_state === "planned") {
        text += ` — ${status.plan_rounds} round(s), ` +
                (status.plan_validated ? "validated" : `${status.plan_issues} issue(s)`);
      }
      if (status.plan_error) text += ` — ${status.plan_error}`;
    }
    sopState.textContent = text;
    planLink.hidden = status.plan_state !== "planned";
    planLink.href = "/runs/" + runId + "/plan.json";
    traceLink.hidden = !["done", "failed"].includes(status.exec_state);
    traceLink.href = "/runs/" + runId + "/trace.json";
  }

  function repoll() {
    clearInterval(pollTimer);
    pollTimer = setInterval(poll, 2000);
    poll();
  }

  async function post(url) {
    const response = await fetch(url, { method: "POST" });
    if (!response.ok) { sopState.textContent = await response.text(); return false; }
    repoll();
    return true;
  }

  planBtn.addEventListener("click", () => {
    planBtn.disabled = true;
    post("/runs/" + runId + "/plan");
  });

  execBtn.addEventListener("click", () => {
    if (liveBox.checked &&
        !confirm("This creates real documents in SAP. Continue?")) return;
    execBtn.disabled = true;
    post("/runs/" + runId + "/execute?live=" + (liveBox.checked ? "true" : "false"));
  });

  function showElapsed(seconds) { elapsedEl.textContent = "elapsed " + Math.floor(seconds) + " s"; }

  function tick() { showElapsed((Date.now() - startedAt) / 1000); }

  function finish(status) {
    clearInterval(pollTimer);
    clearInterval(tickTimer);
    showElapsed(status.elapsed_s);
    if (status.tamper_step !== null) {
      tamperEl.textContent = status.tamper_applied
        ? "Demo tamper: step " + status.tamper_step
        : "Demo tamper requested for step " + status.tamper_step + ", runbook has " +
          (status.runbook ? status.runbook.steps.length : 0) + " steps";
    }
    if (status.trace_url) {
      traceEl.innerHTML = '<a href="' + status.trace_url + '" target="_blank" rel="noopener">trace</a>';
    }
  }

  async function poll() {
    const response = await fetch("/status/" + runId);
    if (response.status === 404) {
      clearInterval(pollTimer);
      clearInterval(tickTimer);
      setRight('<p class="state">Run not found</p>');
      return;
    }
    if (!response.ok) return;
    const status = await response.json();
    callsEl.textContent = "calls " + status.calls;
    tokensEl.textContent = "tokens " + (status.input_tokens + status.output_tokens);
    if (status.runbook && !exportEl.hasAttribute("href")) exportEl.href = "/runs/" + runId + "/runbook.md";
    const fragment = await fetch("/runs/" + runId + "/runbook.html");
    if (fragment.ok) {
      let html = await fragment.text();
      if (status.state === "failed" && status.runbook) {
        html = '<div class="banner">' + escapeHtml(status.error) + "</div>" + html;
      }
      setRight(html);
    }
    renderSop(status);
    const sopBusy = status.plan_state === "compiling" ||
                    status.exec_state === "requested" || status.exec_state === "running";
    if ((status.state === "done" || status.state === "failed") && !sopBusy) finish(status);
  }

  function escapeHtml(text) {
    const node = document.createElement("span");
    node.textContent = text;
    return node.innerHTML;
  }

  right.addEventListener("click", (event) => {
    const row = event.target.closest("[data-timestamp]");
    if (!row) return;
    video.currentTime = Number(row.dataset.timestamp);
    video.pause();
  });

  fileInput.addEventListener("change", () => { if (fileInput.files[0]) upload(fileInput.files[0]); });
  dropzone.addEventListener("dragover", (event) => { event.preventDefault(); dropzone.classList.add("over"); });
  dropzone.addEventListener("dragleave", () => dropzone.classList.remove("over"));
  dropzone.addEventListener("drop", (event) => {
    event.preventDefault();
    dropzone.classList.remove("over");
    const file = event.dataTransfer.files[0];
    if (file) upload(file);
  });
</script>
</body>
</html>
