[project]
name = "video-to-runbook"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "jinja2>=3.1.0",
    "logfire>=5.1.0",
    "modal>=1.5.5",
    "pydantic-ai>=2.46.0",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_to_runbook"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint.isort]
known-first-party = ["video_to_runbook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: hits Gemini; needs GEMINI_API_KEY"]
